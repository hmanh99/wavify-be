spring:
  application:
    name: wavify-be
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: "jdbc:postgresql://localhost:5432/wavify"
    driverClassname: org.postgresql.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: 50MB

jwt:
  token:
    signer-key: "your-random-secret-key-with-more-than-64-characters-length-wavify-be-secret-key-2026"
    expire-length: 900 # 15 minutes in sec
  refresh-token:
    expire-length: 604800 # 7 days in sec

cloudinary:
  cloud-name: # your cloudinary cloud name
  api-key: # cloudinary api key
  api-secret: # cloudinary secret key
